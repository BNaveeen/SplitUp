name: Keep Render Awake

on:
  schedule:
    - cron: '*/14 * * * *'   # every 14 minutes — Render sleeps at 15 min idle
  workflow_dispatch:           # allow manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://splitup-qttj.onrender.com/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: backend returned $STATUS"
          fi
