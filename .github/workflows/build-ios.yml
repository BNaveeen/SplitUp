name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - 'frontend/capacitor.config.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mobile web assets
        working-directory: frontend
        run: npm run build:mobile

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift packages
        working-directory: frontend/ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build archive (no signing)
        working-directory: frontend/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SplitUp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/SplitUp.xcarchive/Products" -name "*.app" | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r SplitUp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SplitUp-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/SplitUp.ipa
          retention-days: 30
